{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="mb-4">
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-muted small">Tu progreso: {{ current_count }} de {{ total }}</span>
                    <span class="text-muted small">{{ progress|floatformat:0 }}%</span>
                </div>
                <div class="progress" style="height: 10px;">
                    <div class="progress-bar bg-success" role="progressbar" style="width: {{ progress }}%"></div>
                </div>
            </div>

            <div class="card shadow-lg border-0 p-4">
                <div class="card-body text-center">
                    <h2 class="mb-4 fw-bold">Practica Castellano</h2>
                    <p class="lead p-4 bg-light rounded border">{{ exercise.question }}</p>
                    
                    <div class="form-group mt-4">
                        <input type="text" id="userAnswer" class="form-control form-control-lg text-center" placeholder="Escribe tu respuesta aquí...">
                    </div>

                    <div id="feedback" class="mt-3 d-none p-3 rounded fw-bold"></div>

                    <div class="mt-4 d-grid gap-2">
                        <button onclick="checkAnswer()" id="btnCheck" class="btn btn-primary btn-lg">Verificar</button>
                        <a href="{% url 'generator:random_exercise' %}" class="btn btn-outline-secondary d-none" id="btnNext">Siguiente Ejercicio →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function checkAnswer() {
    const userAnswer = document.getElementById('userAnswer').value.trim().toLowerCase();
    const correctAnswer = "{{ exercise.correct_answer|escapejs }}".toLowerCase();
    const feedback = document.getElementById('feedback');
    const btnNext = document.getElementById('btnNext');
    const btnCheck = document.getElementById('btnCheck');

    feedback.classList.remove('d-none', 'alert-success', 'alert-danger');
    
    if (userAnswer === correctAnswer) {
        feedback.innerText = "¡Excelente! Respuesta correcta. ✨";
        feedback.classList.add('alert-success');
        btnNext.classList.remove('d-none');
        btnCheck.classList.add('d-none');
    } else {
        feedback.innerText = "Casi... Inténtalo de nuevo. Pincha en 'Siguiente' si te rindes.";
        feedback.classList.add('alert-danger');
        btnNext.classList.remove('d-none'); // Permitimos pasar aunque falle
    }
}
</script>
{% endblock %}
