{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ accion }} Curso{% endblock %}
{% block content %}
<div class="animate-fade-in">
    <h1 class="mb-4"><i class="fas fa-book text-primary"></i> {{ accion }} Curso</h1>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                <a href="{% if curso %}{% url 'profesor_curso_detalle' curso.id %}{% else %}{% url 'profesor_cursos_lista' %}{% endif %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
