{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h1 class="mb-4"><i class="fas fa-exclamation-triangle text-danger"></i> Confirmar eliminación</h1>
<div class="card"><div class="card-body">
    <p>¿Seguro que quieres eliminar este {{ tipo }}?</p>
    <p><strong>{{ objeto }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Sí, eliminar</button>
        {% if volver_arg %}
        <a href="{% url volver_url volver_arg %}" class="btn btn-secondary">Cancelar</a>
        {% else %}
        <a href="{% url volver_url %}" class="btn btn-secondary">Cancelar</a>
        {% endif %}
    </form>
</div></div>
{% endblock %}
